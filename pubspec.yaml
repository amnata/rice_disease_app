name: rice_disease_app
description: Application de segmentation des maladies du riz
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Caméra et images
  camera: ^0.10.5
  image_picker: ^1.0.4
  image: ^4.1.3
  
  # Réseau
  http: ^1.1.0
  
  # Stockage local
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  
  # Utilitaires
  permission_handler: ^11.0.1
  flutter_native_splash: ^2.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/

flutter_native_splash:
  color: "#4CAF50"
  image: assets/images/placeholder.png
  android: true
  ios: true
